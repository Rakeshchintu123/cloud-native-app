apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloud-native-app
  labels:
    app: cloud-native-app

spec:
  replicas: 3

  selector:
    matchLabels:
      app: cloud-native-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:
    metadata:
      labels:
        app: cloud-native-app

    spec:
      containers:
        - name: cloud-native-app

          image: 943755888791.dkr.ecr.us-east-1.amazonaws.com/aws-devops-app:12

          imagePullPolicy: Always

          ports:
            - containerPort: 5000
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3